<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX Stock Market Dashboard</title>
<style>
:root{
  --bg:#121212; --sf:#1e1e1e; --bd:#333; --tx:#e0e0e0;
  --tx2:#aaa; --ac:#4fc3f7; --gn:#66bb6a; --rd:#ef5350;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg); color:var(--tx); font-family:'Segoe UI',system-ui,sans-serif;
  padding:24px; max-width:1400px; margin:0 auto; -webkit-text-size-adjust:100%;}
h1{color:var(--ac); margin-bottom:4px; font-size:24px}
.subtitle{color:var(--tx2); margin-bottom:8px; font-size:13px}
.global-bar{display:flex; align-items:center; gap:6px; margin-bottom:22px; flex-wrap:wrap;
  padding:10px 0; border-bottom:1px solid var(--bd);}
.global-bar .hint{color:var(--tx2); font-size:13px; font-weight:600}
.bb-toggle{margin-left:auto; display:flex; align-items:center; gap:6px;
  color:var(--tx2); font-size:12px; background:var(--sf); border:1px solid var(--bd);
  border-radius:6px; padding:4px 10px; user-select:none;}
.bb-toggle input,.bb-toggle label{cursor:pointer}
.bb-toggle input[type=number]{width:46px; background:#111; color:var(--tx);
  border:1px solid var(--bd); border-radius:4px; padding:2px 4px; font-size:11px;
  font-family:'Cascadia Code',monospace;}
.section-title{color:var(--ac); font-size:18px; margin:28px 0 16px; padding-bottom:8px;
  border-bottom:1px solid var(--bd); grid-column:1/-1;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:20px}
@media (max-width:900px){
  body{padding:14px} .grid{grid-template-columns:1fr; gap:14px}
  .bb-toggle{margin-left:0; width:100%; justify-content:space-between; flex-wrap:wrap}
  .card{padding:14px} canvas{height:220px !important}
}
.card{background:var(--sf); border:1px solid var(--bd); border-radius:10px; padding:20px;}
.card h2{color:var(--ac); font-size:15px; margin-bottom:8px}
.card.loading h2::after{content:" loading..."; font-size:11px; color:var(--tx2); animation:pulse 1.5s infinite;}
.card.error{border-color:var(--rd)}
.card.cached h2::after{content:" (cached)"; font-size:10px; color:var(--gn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.card-range-bar{display:flex; flex-wrap:wrap; gap:4px; margin:8px 0 10px;
  padding-bottom:8px; border-bottom:1px dashed var(--bd);}
.rbtn{color:var(--tx2); background:#181818; border:1px solid var(--bd); border-radius:4px;
  padding:3px 8px; font-size:11px; font-weight:600; cursor:pointer; user-select:none;
  transition:background .15s, border-color .15s, color .15s;}
.rbtn:hover{color:#fff; border-color:var(--ac); background:#1a2a3a}
.rbtn.active{color:#fff; background:var(--ac); border-color:var(--ac)}
.rbtn.loading{opacity:.55; cursor:wait}
.current-rate{color:var(--tx); font-size:13px; margin-bottom:10px; line-height:1.6}
.rate-value{font-family:'Cascadia Code','Fira Code',Consolas,monospace; font-size:17px; font-weight:700; color:#fff;}
.pos{color:var(--gn); font-weight:600}
.neg{color:var(--rd); font-weight:600}
.stats-row{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.stat{background:#1a1a2e; border:1px solid var(--bd); border-radius:6px; padding:6px 10px;
  flex:1; min-width:80px; text-align:center;}
.stat-label{display:block; font-size:9px; text-transform:uppercase; letter-spacing:1px;
  color:var(--tx2); margin-bottom:2px;}
.stat-value{font-family:'Cascadia Code',monospace; font-size:13px; font-weight:600; color:var(--tx);}
.chart-wrap{position:relative; height:230px}
canvas{margin-top:6px; display:block; width:100% !important; height:100% !important}
.footer{text-align:center; color:var(--tx2); font-size:11px; margin-top:16px; grid-column:1/-1;}
.footer a{color:var(--ac); text-decoration:none}
.status-bar{color:var(--tx2); font-size:12px; padding:6px 0; margin-bottom:10px;
  border-bottom:1px solid var(--bd); display:flex; align-items:center; gap:8px;}
.spinner{display:inline-block; width:14px; height:14px; border:2px solid var(--bd);
  border-top-color:var(--ac); border-radius:50%; animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:3px; background:var(--bd); border-radius:2px; overflow:hidden; flex:1; max-width:200px}
.progress-bar{height:100%; background:var(--ac); width:0%; transition:width .3s}
.fatal{color:var(--rd); font-weight:600}
</style>
</head>
<body>
<h1>&#128178; FX, Stock &amp; Market Dashboard</h1>

<div class="status-bar" id="statusBar">

<div class="global-bar">

	<input type="checkbox" id="bbToggle" checked>
	<label for="bbToggle">Bollinger Bands</label>
	<span style="color:var(--bd)">|</span>

	<input type="number" id="bbPeriod" value="20" min="2" max="200">

<script>
/* ============================================================
   DYNAMIC CHART.JS LOADER  (built from parts to avoid mangling)
   ============================================================ */
function loadChartJs(){
  return new Promise(function(resolve,reject){
	if(typeof Chart!=="undefined"){ resolve(); return; }
	var proto="https:";
	var cdns=[
  	proto+"//"+["cdn.jsdelivr.net","npm","chart.js@4.4.7","dist","chart.umd.min.js"].join("/"),
  	proto+"//"+["unpkg.com","chart.js@4.4.7","dist","chart.umd.js"].join("/"),
  	proto+"//"+["cdnjs.cloudflare.com","ajax","libs","Chart.js","4.4.7","chart.umd.min.js"].join("/")
	];
	var idx=0;
	function tryNext(){
  	if(idx>=cdns.length){ reject(new Error("All CDNs failed")); return; }
  	var s=document.createElement("script");
  	s.src=cdns[idx++];
  	s.async=true;
  	s.onload=function(){
    	if(typeof Chart!=="undefined") resolve(); else tryNext();
  	};
  	s.onerror=function(){ tryNext(); };
  	document.head.appendChild(s);
	}
	tryNext();
  });
}

/* ============================================================
   UTILITIES
   ============================================================ */
function pad2(n){return String(n).padStart(2,"0")}
function dateStr(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function fmtRate(v){
  if(v==null||isNaN(v))return"\u2014";
  if(Math.abs(v)<10)return Number(v).toFixed(4);
  return Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function getRangeSpec(key){
  for(var i=0;i<RANGES.length;i++) if(RANGES[i].key===key) return RANGES[i];
  return RANGES[0];
}
function getFetchDays(rangeKey){
  var r=getRangeSpec(rangeKey);
  if(r.ytd){
	var now=new Date(), jan1=new Date(now.getFullYear(),0,1);
	return Math.max(2, Math.ceil((now-jan1)/86400000)+5);
  }
  return r.fetchDays;
}
function getCutoffStr(rangeKey){
  var r=getRangeSpec(rangeKey);
  var now=new Date();
  if(r.ytd) return dateStr(new Date(now.getFullYear(),0,1));
  var d=(r.cutoffDays!=null)?r.cutoffDays:r.fetchDays;
  return dateStr(new Date(now.getTime()-d*86400000));
}
function setStatus(msg,done){
  document.getElementById("statusText").textContent=msg;
  if(done){
	var sp=document.getElementById("spinner");
	if(sp) sp.outerHTML='<span style="color:var(--gn);font-size:16px">\u2713</span>';
  }
}
function setFatal(msg){
  document.getElementById("statusText").innerHTML='<span class="fatal">'+msg+'</span>';
  var sp=document.getElementById("spinner");

}
function bumpProgress(){
  loadedCount++;

/* ============================================================
   BOLLINGER BANDS
   ============================================================ */
function computeBollinger(rates,period,k){
  var n=rates.length;
  var upper=new Array(n).fill(null);
  var middle=new Array(n).fill(null);
  var lower=new Array(n).fill(null);
  if(n<period||period<2) return {upper:upper,middle:middle,lower:lower};
  var sum=0,sumSq=0;
  for(var i=0;i<period;i++){sum+=rates[i]; sumSq+=rates[i]*rates[i];}
  function fillAt(i){
	var mean=sum/period;
	var v=(sumSq/period)-mean*mean; if(v<0)v=0;
	var sd=Math.sqrt(v);
	middle[i]=mean; upper[i]=mean+k*sd; lower[i]=mean-k*sd;
  }
  fillAt(period-1);
  for(var j=period;j<n;j++){
	var out=rates[j-period], inn=rates[j];
	sum+=inn-out; sumSq+=inn*inn-out*out;
	fillAt(j);
  }
  return {upper:upper,middle:middle,lower:lower};
}

/* ============================================================
   DOWNSAMPLER (LTTB-lite)
   ============================================================ */
function downsampleIndices(values,target){
  var n=values.length;
  if(n<=target){var all=new Array(n); for(var i=0;i<n;i++) all[i]=i; return all;}
  var out=[0], bucketSize=(n-2)/(target-2), a=0;
  for(var i=0;i<target-2;i++){
	var rs=Math.floor((i+1)*bucketSize)+1, re=Math.floor((i+2)*bucketSize)+1;
	re=Math.min(re,n);
	var avgX=0, avgY=0, avgN=Math.max(1,re-rs);
	for(var k=rs;k<re;k++){avgX+=k; avgY+=values[k]||0;}
	avgX/=avgN; avgY/=avgN;
	var ws=Math.floor(i*bucketSize)+1, we=Math.floor((i+1)*bucketSize)+1;
	var pax=a, pay=values[a]||0;
	var maxArea=-1, nextA=ws;
	for(var j=ws;j<we;j++){
  	var area=Math.abs((pax-avgX)*((values[j]||0)-pay)-(pax-j)*(avgY-pay))*0.5;
  	if(area>maxArea){maxArea=area; nextA=j;}
	}
	out.push(nextA); a=nextA;
  }
  out.push(n-1);
  return out;
}

/* ============================================================
   TWO-TIER CACHE
   ============================================================ */
function cacheKey(src,id,rangeKey){return"fxdash:"+src+":"+id+":"+rangeKey}
function cacheGet(key){
  try{var raw=sessionStorage.getItem(key);
	if(raw){var o=JSON.parse(raw); if(Date.now()-o.t<=CACHE_TTL_MS) return o.d; sessionStorage.removeItem(key);}
  }catch(e){}
  try{var raw2=localStorage.getItem(key);
	if(raw2){var o2=JSON.parse(raw2); if(Date.now()-o2.t<=CACHE_TTL_LS) return o2.d; localStorage.removeItem(key);}
  }catch(e){}
  return null;
}
function cacheSet(key,data){
  var payload=JSON.stringify({t:Date.now(),d:data});
  try{sessionStorage.setItem(key,payload)}catch(e){}
  try{localStorage.setItem(key,payload)}catch(e){
	try{
  	for(var i=0;i<localStorage.length;i++){
    	var k=localStorage.key(i);
    	if(k&&k.indexOf("fxdash:")===0){localStorage.removeItem(k);break;}
  	}
  	localStorage.setItem(key,payload);
	}catch(_){}
  }
}

/* ============================================================
   FETCHERS
   ============================================================ */
function fetchWithTimeout(url,ms){
  var ctrl=new AbortController();
  var tid=setTimeout(function(){ctrl.abort()},ms);
  return fetch(url,{signal:ctrl.signal})
	.then(function(r){clearTimeout(tid); return r})
	.catch(function(e){clearTimeout(tid); throw e});
}

async function fetchFX(base,quote,rangeKey){
  var key=cacheKey("fx",base+quote,rangeKey);
  var cached=cacheGet(key);
  if(cached) return {data:cached,fromCache:true};

  var now=new Date();
  var days=getFetchDays(rangeKey);
  var from=new Date(now.getTime()-days*86400000);
  // Built from parts to avoid mangling.
  var host=["api","frankfurter","dev"].join(".");
  var url="https://"+host+"/v1/"+dateStr(from)+".."+dateStr(now)+
      	"?base="+base+"&symbols="+quote;

  var lastErr;
  for(var a=0;a<=MAX_RETRIES;a++){
	try{
  	var resp=await fetchWithTimeout(url,FETCH_TIMEOUT_MS);
  	if(!resp.ok) throw new Error("HTTP "+resp.status);
  	var data=await resp.json();
  	var dates=[], rates=[];
  	if(data && data.rates){
    	var keys=Object.keys(data.rates).sort();
    	for(var i=0;i<keys.length;i++){
      	var v=data.rates[keys[i]][quote];
      	if(v!=null){dates.push(keys[i]); rates.push(v);}
    	}
  	}
  	if(!dates.length) throw new Error("Empty FX series");
  	var out={dates:dates,rates:rates};
  	cacheSet(key,out);
  	return {data:out,fromCache:false};
	}catch(e){
  	lastErr=e;
  	if(a<MAX_RETRIES) await new Promise(function(r){setTimeout(r,800)});
	}
  }
  throw lastErr||new Error("FX fetch failed");
}

async function fetchYahoo(ticker,rangeKey){
  var key=cacheKey("yh",ticker,rangeKey);
  var cached=cacheGet(key);
  if(cached) return {data:cached,fromCache:true};

  var spec=getRangeSpec(rangeKey);
  var interval=spec.yahooInterval||"1d";
  var qs;
  if(rangeKey==="1D"){
	qs="?range=1d&interval="+interval+"&includePrePost=false&events=";
  } else {
	var now=Math.floor(Date.now()/1000);
	var days=getFetchDays(rangeKey);
	var from=now-Math.max(days,2)*86400;
	qs="?period1="+from+"&period2="+now+"&interval="+interval+"&includePrePost=false&events=";
  }
  var yHost=["query1","finance","yahoo","com"].join(".");
  var yUrl="https://"+yHost+"/v8/finance/chart/"+encodeURIComponent(ticker)+qs;
  var proxies=[
	"https://"+["corsproxy","io"].join(".")+"/?"+encodeURIComponent(yUrl),
	"https://"+["api","allorigins","win"].join(".")+"/raw?url="+encodeURIComponent(yUrl),
	"https://"+["api","codetabs","com"].join(".")+"/v1/proxy/?quest="+encodeURIComponent(yUrl)
  ];

  function tryOne(url){
	return fetchWithTimeout(url,FETCH_TIMEOUT_MS).then(function(resp){
  	if(!resp.ok) throw new Error("HTTP "+resp.status);
  	return resp.json();
	}).then(function(data){
  	var result=data&&data.chart&&data.chart.result&&data.chart.result[0];
  	if(!result) throw new Error("Bad payload");
  	var ts=result.timestamp||[];
  	var q=result.indicators&&result.indicators.quote&&result.indicators.quote[0];
  	var closes=(q&&q.close)||[];
  	var dates=[], rates=[];
  	var intraday=(interval.indexOf("m")>0||interval.indexOf("h")>0);
  	for(var j=0;j<ts.length;j++){
    	if(closes[j]!=null){
      	var d=new Date(ts[j]*1000);
      	dates.push(intraday
          	? d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes())
          	: dateStr(d));
      	rates.push(Math.round(closes[j]*10000)/10000);
    	}
  	}
  	if(!dates.length) throw new Error("Empty Yahoo series");
  	return {dates:dates,rates:rates};
	});
  }

  var lastErr;
  for(var a=0;a<=MAX_RETRIES;a++){
	try{
  	var out=await Promise.any(proxies.map(tryOne));
  	cacheSet(key,out);
  	return {data:out,fromCache:false};
	}catch(e){
  	lastErr=e;
  	if(a<MAX_RETRIES) await new Promise(function(r){setTimeout(r,1000)});
	}
  }
  throw lastErr||new Error("Yahoo fetch failed: "+ticker);
}

/* ============================================================
   CONCURRENCY LIMITER
   ============================================================ */
async function runWithLimit(tasks,limit){
  var i=0, workers=[];
  for(var w=0;w<limit;w++){
	workers.push((async function(){
  	while(i<tasks.length){ var idx=i++; await tasks; }
	})());
  }
  await Promise.all(workers);
}
